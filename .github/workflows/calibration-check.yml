name: Daily calibration check

# Explicit feedback: run the walk-forward backtest (scripts/calibration.py)
# every day, not just by hand after a model change, so a real calibration
# problem (like the NBL/NFL overconfidence found 2026-10-27 -- see
# tips/generate_tips.py's PREDICTION_KELLY_FRACTION comment) gets caught
# automatically instead of waiting for someone to think to check. Zero
# Odds API quota -- scripts/calibration.py is ESPN-only (free), so this
# can run as often as daily for free. Commits the output to CALIBRATION.md
# so there's a plain, diffable history right in the repo -- no need to dig
# through Actions logs to see whether anything drifted.
on:
  schedule:
    # Shifted alongside the main tips refresh (2026-10-30: 7am -> 9am AEDT) --
    # kept at roughly an hour after it, same spacing as before.
    - cron: "0 23 * * *"  # ~10am AEDT / 9am AEST -- after the main tips refresh
  workflow_dispatch: {}

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run walk-forward calibration backtest
        run: |
          {
            echo "# Daily calibration check"
            echo
            echo "Auto-generated by \`scripts/calibration.py\` (\`.github/workflows/calibration-check.yml\`), $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo "Walk-forward backtest against real results (ESPN, free) -- checks whether a predicted probability"
            echo "actually hits that often, out-of-sample. See tips/generate_tips.py's PREDICTION_KELLY_FRACTION"
            echo "comment for why this matters: a sport whose Gap column drifts meaningfully negative in the"
            echo "50-70% band is one whose Predictions are sized on overconfident numbers."
            echo
            echo '```'
            python -m scripts.calibration
            echo '```'
          } > CALIBRATION.md

      - name: Commit if changed
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CALIBRATION.md
          git diff --staged --quiet || git commit -m "Daily calibration check $(date -u +%F)"
          git push
