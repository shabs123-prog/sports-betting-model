name: Daily tips refresh

# Runs the pipeline before you'd realistically check your phone, and commits
# the refreshed tips.db back to the repo. Streamlit Community Cloud
# auto-redeploys on every push to main, so by the time you open the app the
# data's already there -- no first-load wait on your end.
#
# Needs one repo secret set first: Settings -> Secrets and variables ->
# Actions -> New repository secret: ODDS_API_KEY (same value as your local
# .env). Results-history data comes from ESPN's public API, no key needed.

on:
  schedule:
    - cron: "0 19 * * *"  # ~6am AEDT / 5am AEST -- adjust for your timezone/DST
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Refresh NBA
        run: python -m scripts.run_daily nba
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Refresh EPL
        run: python -m scripts.run_daily epl
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit refreshed tips.db
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tips.db
          git diff --staged --quiet || git commit -m "Daily tips refresh $(date -u +%F)"
          git push
