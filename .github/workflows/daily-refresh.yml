name: Daily tips refresh

# Runs the pipeline before you'd realistically check your phone, and commits
# the refreshed tips.db + docs/data.json back to the repo. Streamlit
# Community Cloud auto-redeploys on every push to main (for the Bet
# Tracker/Settings dashboard), and GitHub Pages serves docs/ straight from
# the repo (for the installable PWA) -- so by the time you open either, the
# data's already there, no first-load wait on your end.
#
# Needs one repo secret set first: Settings -> Secrets and variables ->
# Actions -> New repository secret: ODDS_API_KEY (same value as your local
# .env). Results-history data comes from ESPN's public API, no key needed.
#
# Which sports get refreshed by the scheduled run isn't hardcoded --
# scripts/run_auto_refresh.py reads config.SPORT_CONFIG's auto_refresh flag,
# same as the dashboard, so flipping a sport on there (e.g. once NRL/BBL are
# back in season) is the only change needed, no workflow edit required.
# Manual runs (Actions tab -> Run workflow) can instead pick one specific
# sport from the dropdown -- refreshes just that one, which both bypasses
# auto_refresh (so you can check an off sport on purpose) and avoids
# spending quota re-checking sports you don't currently care about.

on:
  schedule:
    # Explicit feedback (2026-10-30): shifted from ~7am/~6pm to ~9am/~8pm
    # AEDT -- the old times are gone, not just supplemented.
    - cron: "0 22 * * *"  # ~9am AEDT / 8am AEST -- full refresh, all auto_refresh sports
    # NBA-only, ~8pm AEDT/7pm AEST the evening BEFORE game day -- NBA plays
    # daily (unlike EPL/NFL), and explicit feedback is that the 9am refresh
    # alone is too early relative to when bets actually get placed (the
    # evening before). Adds only ~6 credits/day (1 sport's bulk pull) --
    # affordable with 4 keys/2000 a month now.
    - cron: "0 9 * * *"   # ~8pm AEDT / 7pm AEST
    # NBL-only, every 3 hours -- explicit feedback 2026-10-31: NBL's value
    # specifically comes from catching a line BEFORE it drifts ("get it as
    # early as possible... the line changes closer to game day and you're
    # to predict that"), the opposite timing emphasis from NBA (where
    # injuries confirmed close to game time matter more, hence NBA staying
    # on the night-before-only cron above). Offset 10 past the hour so it
    # doesn't land on results-refresh.yml's own :00 three-hourly schedule
    # and race it on the same tips.db/data.json push.
    - cron: "10 */3 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "Refresh just this sport (saves quota vs refreshing everything), or all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - nba
          - epl
          - nbl
          - nfl
          - afl
          - nrl
          - bbl

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Which sport(s) to refresh, in priority order: a manual "sport" input
      # wins if present; otherwise match the firing cron's own string (8pm
      # = NBA only, every-3-hours = NBL only); otherwise (the 9am cron, or
      # anything else) means "all", same as the original single-schedule
      # behaviour.
      - name: Refresh sport(s)
        run: python -m scripts.run_auto_refresh "${{ github.event.inputs.sport || (github.event.schedule == '0 9 * * *' && 'nba') || (github.event.schedule == '10 */3 * * *' && 'nbl') || 'all' }}"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional additional free-tier keys -- data/odds_api.py falls
          # over to the next one automatically once the current one's
          # monthly quota is used up. Safe to leave unset.
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}

      - name: Build PWA site data
        run: python -m pwa.build_site

      - name: Commit refreshed tips.db + PWA data
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tips.db docs/data.json
          git diff --staged --quiet && exit 0
          git commit -m "Daily tips refresh $(date -u +%F)"
          # Real risk added 2026-10-31: this workflow now fires every 3
          # hours for NBL on top of its existing two daily runs, and
          # results-refresh.yml fires every 3 hours too -- two scheduled
          # jobs racing to push the same branch is now a real, not
          # theoretical, possibility, and a bare `git push` has no retry,
          # so the loser's run would just fail outright and silently drop
          # that refresh. Retry a few times: fetch + rebase onto whatever
          # landed first, then push again.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done
          git push
