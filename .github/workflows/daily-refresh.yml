name: Daily tips refresh

# Runs the pipeline before you'd realistically check your phone, and commits
# the refreshed tips.db + docs/data.json back to the repo. Streamlit
# Community Cloud auto-redeploys on every push to main (for the Bet
# Tracker/Settings dashboard), and GitHub Pages serves docs/ straight from
# the repo (for the installable PWA) -- so by the time you open either, the
# data's already there, no first-load wait on your end.
#
# Needs one repo secret set first: Settings -> Secrets and variables ->
# Actions -> New repository secret: ODDS_API_KEY (same value as your local
# .env). Results-history data comes from ESPN's public API, no key needed.
#
# Which sports get refreshed by the scheduled run isn't hardcoded --
# scripts/run_auto_refresh.py reads config.SPORT_CONFIG's auto_refresh flag,
# same as the dashboard, so flipping a sport on there (e.g. once NRL/BBL are
# back in season) is the only change needed, no workflow edit required.
# Manual runs (Actions tab -> Run workflow) can instead pick one specific
# sport from the dropdown -- refreshes just that one, which both bypasses
# auto_refresh (so you can check an off sport on purpose) and avoids
# spending quota re-checking sports you don't currently care about.

on:
  schedule:
    - cron: "0 20 * * *"  # ~7am AEDT / 6am AEST -- full refresh, all auto_refresh sports
    # NBA-only, ~6pm AEDT/5pm AEST the evening BEFORE game day -- NBA plays
    # daily (unlike EPL/NFL), and explicit feedback is that 6am data is too
    # early relative to when bets actually get placed (the evening before).
    # Adds only ~6 credits/day (1 sport's bulk pull) -- affordable with 3
    # keys/1500 a month now, wasn't with 2/1000.
    - cron: "0 7 * * *"   # ~6pm AEDT / 5pm AEST
  workflow_dispatch:
    inputs:
      sport:
        description: "Refresh just this sport (saves quota vs refreshing everything), or all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - nba
          - epl
          - nbl
          - nfl
          - afl
          - nrl
          - bbl

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Which sport(s) to refresh, in priority order: a manual "sport" input
      # wins if present; otherwise the 6pm cron (github.event.schedule
      # equals its own cron string) means NBA only; otherwise (the 7am
      # cron, or anything else) means "all", same as the original
      # single-schedule behaviour.
      - name: Refresh sport(s)
        run: python -m scripts.run_auto_refresh "${{ github.event.inputs.sport || (github.event.schedule == '0 7 * * *' && 'nba' || 'all') }}"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional additional free-tier keys -- data/odds_api.py falls
          # over to the next one automatically once the current one's
          # monthly quota is used up. Safe to leave unset.
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}

      - name: Build PWA site data
        run: python -m pwa.build_site

      - name: Commit refreshed tips.db + PWA data
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tips.db docs/data.json
          git diff --staged --quiet || git commit -m "Daily tips refresh $(date -u +%F)"
          git push
